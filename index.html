<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>para ti — una mini biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #f2e6d1;
    --papel-oscuro: #e8d8bd;
    --tinta: #2c2418;
    --acento: #c1613f;
    --acento-suave: #d48a6d;
    --gris-lugar: #d9cdb8;
    --gris-texto: #b3a68d;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(193, 97, 63, 0.06), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(44, 36, 24, 0.05), transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(44,36,24,0.008) 3px, rgba(44,36,24,0.008) 4px),
      var(--papel);
    color: var(--tinta);
    font-family: 'Lora', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===================== PANTALLAS ===================== */
  .pantalla {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.4s ease, visibility 1.4s ease;
  }

  .pantalla.oculta {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ===================== PANTALLA 1 ===================== */
  #bienvenida {
    cursor: pointer;
    text-align: center;
    padding: 2rem;
  }

  #bienvenida .saludo {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 600;
    color: var(--tinta);
    opacity: 0;
    animation: aparecerLento 3.2s ease 0.6s forwards;
  }

  #bienvenida .invitacion {
    margin-top: 2.2rem;
    font-size: clamp(0.8rem, 1.6vw, 0.95rem);
    font-style: italic;
    letter-spacing: 0.12em;
    color: rgba(44, 36, 24, 0.45);
    opacity: 0;
    animation: aparecerSuave 2.5s ease 2.8s forwards;
  }

  #bienvenida .invitacion::after {
    content: "";
    display: block;
    width: 1px;
    height: 34px;
    margin: 1.2rem auto 0;
    background: linear-gradient(to bottom, rgba(193,97,63,0.55), transparent);
    animation: respirar 3s ease-in-out infinite;
  }

  @keyframes aparecerLento {
    from { opacity: 0; transform: translateY(14px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes aparecerSuave {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes respirar {
    0%, 100% { opacity: 0.4; transform: scaleY(1); }
    50%      { opacity: 1;  transform: scaleY(1.25); }
  }

  /* ===================== PANTALLA 2 ===================== */
  #biblioteca {
    opacity: 0;
    visibility: hidden;
    padding: 3rem 1.5rem;
    overflow-y: auto;
    justify-content: flex-start;
  }

  #biblioteca.visible {
    opacity: 1;
    visibility: visible;
  }

  .titulo-estanteria {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.9rem, 4.5vw, 2.8rem);
    font-weight: 600;
    color: var(--tinta);
    margin-bottom: 0.4rem;
    text-align: center;
  }

  .subtitulo-estanteria {
    font-size: 0.85rem;
    font-style: italic;
    letter-spacing: 0.14em;
    color: rgba(44, 36, 24, 0.45);
    margin-bottom: 3rem;
    text-align: center;
  }

  .estanteria {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.6rem 1.2rem;
    width: 100%;
    max-width: 760px;
  }

  @media (max-width: 620px) {
    .estanteria {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.4rem 0.9rem;
      max-width: 420px;
    }
  }

  @media (max-width: 380px) {
    .estanteria {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 280px;
    }
  }

  /* ---- cada libro ---- */
  .libro {
    position: relative;
    aspect-ratio: 3 / 4.4;
    border-radius: 4px 8px 8px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease;
  }

  /* lomo: línea lateral que simula el canto del libro */
  .libro::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    bottom: 0;
    width: 2px;
    border-radius: 2px;
  }

  /* ---- libro activo ---- */
  .libro.activo {
    background: linear-gradient(155deg, #cf7050 0%, var(--acento) 45%, #a95134 100%);
    box-shadow:
      0 14px 30px -8px rgba(193, 97, 63, 0.45),
      0 4px 10px rgba(44, 36, 24, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    opacity: 0;
    transform: translateY(24px);
  }

  /* CORREGIDO: #biblioteca.visible en lugar de .biblioteca.visible */
  #biblioteca.visible .libro.activo {
    animation: subirLibro 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }

  @keyframes subirLibro {
    to { opacity: 1; transform: translateY(0); }
  }

  .libro.activo::before {
    background: rgba(242, 230, 209, 0.35);
    box-shadow: 4px 0 6px -2px rgba(0,0,0,0.2);
  }

  .libro.activo::after {
    content: "";
    position: absolute;
    inset: 10px 8px;
    border: 1px solid rgba(242, 230, 209, 0.28);
    border-radius: 3px;
    pointer-events: none;
  }

  .libro.activo:hover {
    transform: translateY(-8px) rotate(-1.2deg);
    box-shadow:
      0 26px 42px -10px rgba(193, 97, 63, 0.55),
      0 8px 16px rgba(44, 36, 24, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .libro.activo .lomo-titulo {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    font-weight: 700;
    color: var(--papel);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-shadow: 0 1px 3px rgba(44, 36, 24, 0.4);
    padding: 0.4rem 0;
  }

  /* ---- espacios reservados ---- */
  .libro.vacio {
    background: linear-gradient(160deg, var(--papel-oscuro), var(--gris-lugar));
    border: 1px dashed rgba(44, 36, 24, 0.18);
    box-shadow: inset 0 2px 8px rgba(44, 36, 24, 0.06);
    cursor: default;
    opacity: 0;
  }

  /* CORREGIDO: #biblioteca.visible en lugar de .biblioteca.visible */
  #biblioteca.visible .libro.vacio {
    animation: subirLibro 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  #biblioteca.visible .libro.vacio:nth-child(1) { animation-delay: 0.55s; }
  #biblioteca.visible .libro.vacio:nth-child(2) { animation-delay: 0.70s; }
  #biblioteca.visible .libro.vacio:nth-child(4) { animation-delay: 0.85s; }
  #biblioteca.visible .libro.vacio:nth-child(5) { animation-delay: 0.65s; }
  #biblioteca.visible .libro.vacio:nth-child(6) { animation-delay: 0.95s; }
  #biblioteca.visible .libro.vacio:nth-child(7) { animation-delay: 0.75s; }
  #biblioteca.visible .libro.vacio:nth-child(8) { animation-delay: 1.05s; }

  .libro.vacio::before {
    background: rgba(44, 36, 24, 0.08);
  }

  .libro.vacio .lomo-titulo {
    font-family: 'Lora', serif;
    font-size: clamp(0.55rem, 1.3vw, 0.7rem);
    font-style: italic;
    letter-spacing: 0.18em;
    color: var(--gris-texto);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    user-select: none;
  }

  /* ---- pie ---- */
  .pie {
    margin-top: 3.2rem;
    font-size: 0.75rem;
    font-style: italic;
    letter-spacing: 0.14em;
    color: rgba(44, 36, 24, 0.35);
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease 1.6s;
  }

  /* CORREGIDO: #biblioteca.visible en lugar de .biblioteca.visible */
  #biblioteca.visible .pie {
    opacity: 1;
  }
</style>
<base target="_blank">
</head>
<body>

  <!-- PANTALLA 1 · bienvenida -->
  <section id="bienvenida" class="pantalla" role="button" aria-label="Continuar a la biblioteca" tabindex="0">
    <h1 class="saludo">hola. ¿qué haces por aquí?</h1>
    <p class="invitacion">toca en cualquier lugar, hay algo que quería enseñarte</p>
  </section>

  <!-- PANTALLA 2 · biblioteca -->
  <main id="biblioteca" class="pantalla oculta" aria-label="Mini biblioteca de poemas">
    <h2 class="titulo-estanteria">la estantería</h2>
    <p class="subtitulo-estanteria">poemas que fui escribiendo, pensando en ti</p>

    <div class="estanteria">
      <!-- espacio 1: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>

      <!-- espacio 2: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>

      <!-- espacio 3: único libro activo -->
      <a class="libro activo" href="cuaderno.html" aria-label="Abrir el cuaderno de intentos">
        <span class="lomo-titulo">cuaderno de intentos</span>
      </a>

      <!-- espacio 4: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>

      <!-- espacio 5: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>

      <!-- espacio 6: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>

      <!-- espacio 7: vacío sin texto, aún sin idea -->
      <div class="libro vacio" aria-hidden="true"></div>

      <!-- espacio 8: reservado -->
      <div class="libro vacio" aria-hidden="true">
        <span class="lomo-titulo">próximamente</span>
      </div>
    </div>

    <footer class="pie">esta colección sigue creciendo — igual que lo nuestro</footer>
  </main>

<script>
  (function () {
    var bienvenida = document.getElementById('bienvenida');
    var biblioteca = document.getElementById('biblioteca');
    var transicionando = false;

    function irABiblioteca() {
      if (transicionando) return;
      transicionando = true;

      bienvenida.classList.add('oculta');
      biblioteca.classList.remove('oculta');

      // fuerza reflow para que la transición de opacidad se aplique
      void biblioteca.offsetWidth;
      biblioteca.classList.add('visible');

      document.body.style.overflow = 'auto';
    }

    bienvenida.addEventListener('click', irABiblioteca);

    bienvenida.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        irABiblioteca();
      }
    });
  })();
</script>
</body>
</html>
