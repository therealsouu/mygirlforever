<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--papel:#f2e6d1;--tinta:#2c2418;--tinta-dim:rgba(44,36,24,.6);--terracota:#c1613f;--vacio:#d8c9ac}
body{background:var(--papel);color:var(--tinta);font-family:'Lora',serif;overflow:hidden;height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* pantalla 1 */
#bienvenida{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;text-align:center;padding:24px;transition:opacity .8s ease, transform .8s ease}
#bienvenida.oculto{opacity:0;transform:scale(.97);pointer-events:none}
#saludo{font-family:'Caveat';font-weight:700;font-size:clamp(2.2rem,8vw,3.6rem);opacity:0;
  animation:aparece 1.6s ease forwards .3s}
#invita{margin-top:20px;font-style:italic;color:var(--tinta-dim);font-size:.95rem;opacity:0;
  animation:aparece 1.6s ease forwards 1.6s}
#invita span{display:inline-block;width:1px;height:1em;background:var(--terracota);margin-left:4px;
  animation:parpadeo 1s steps(1) infinite}
@keyframes aparece{to{opacity:1}}
@keyframes parpadeo{50%{opacity:0}}

/* pantalla 2 */
#biblioteca{height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;opacity:0;transition:opacity 1s ease}
#biblioteca.visible{display:flex;opacity:1}
#biblioteca h2{font-family:'Caveat';font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:34px;text-align:center}
.estante{display:grid;grid-template-columns:repeat(4,minmax(60px,80px));gap:14px;justify-content:center}
.libro{aspect-ratio:2/3;border-radius:3px;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:8px;font-family:'Lora';font-size:.72rem;line-height:1.3;
  transition:transform .3s ease}
.libro.activo{background:var(--terracota);color:var(--papel);font-style:italic;cursor:pointer;
  text-decoration:none;box-shadow:0 6px 18px rgba(193,97,63,.35)}
.libro.activo:hover{transform:translateY(-6px)}
.libro.vacio{background:var(--vacio);color:var(--tinta-dim);font-size:.62rem;font-style:italic}

@media(max-width:420px){.estante{grid-template-columns:repeat(3,minmax(56px,1fr))}}
</style>
</head>
<body>

<div id="bienvenida" onclick="entrar()">
  <p id="saludo">hola. ¿qué haces por aquí?</p>
  <p id="invita">pasa<span></span></p>
</div>

<div id="biblioteca">
  <h2>una pequeña biblioteca<br>(todavía chiquita)</h2>
  <div class="estante">
    <a class="libro activo" href="cuaderno.html">cuaderno de intentos</a>
    <div class="libro vacio">próximamente</div>
    <div class="libro vacio">próximamente</div>
    <div class="libro vacio">próximamente</div>
    <div class="libro vacio">próximamente</div>
    <div class="libro vacio">próximamente</div>
  </div>
</div>

<script>
function entrar(){
  document.getElementById('bienvenida').classList.add('oculto');
  setTimeout(()=>{
    document.getElementById('bienvenida').style.display='none';
    document.getElementById('biblioteca').classList.add('visible');
  },700);
}
</script>
</body>
</html>
